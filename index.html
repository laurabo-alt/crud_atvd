<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achados e perdidos - escola</title>
    <style>
        body{ font-family: arial, sans-serif; max-width: 900px; margin:30px auto; padding: 0 15px;}
        form{display: grid; gap: 10px; background:#f4f6f9; padding: 15px; border-radius: 8px; margin-bottom: 25px; }
        input, button{padding: 8px; font-size:14px;}
        button{cursor: pointer; background: #0f2c59; color:white; border: none; border-radius: 4px;}
        table{width:100%; border-collapse: collapse;}
        th,td {border: 1px solid #ccc; padding: 8px; text-align: left;}
        th{background:#0f2c59; color: white;}
    </style>
</head>
<body>
    <h1> ssitema de achados e perdidos</h1>
    <from id="from-cadastro">
    <h3>cadastrar novo item encontrado</h3>
    <input type="text" id="titulo" placeholder="titulo do item (ex:garrafa azul)" required>
    <input type="text" id="descricao" placehlder="descricao (cor, marca, detalhe...)">
    <input type="text" id="local_encontrado" placeholder="local encontrado (ex:quadras)" required>
    <input type="date" id="data_encontro" required>
    <button type="submit"> cadastrar item</button>
    </from>

    <table>
        <thead>
            <tr>
               <th>ID</th>
                <th>titulo</th>
                <th>descricao</th>
                <th>local</th>
                <th>data</th>
                <th>status</th>
                <th>ações</th>
            </tr>
        </thead>
    </table>
</body>
</html>
